server:
  port: 8080

spring:
  application:
    name: glorious-travel-backend

  datasource:
    url: jdbc:mysql://localhost:3306/glorious_travel?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: changeme
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # cree/actualise automatiquement les tables au demarrage
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: "CHANGE_ME_super_secret_key_at_least_32_characters_long"
    expiration-ms: 86400000   # 24h
  upload:
    dir: "./uploads"          # dossier local de stockage des photos/videos

logging:
  level:
    com.glorioustravel: INFO
